name: Snowflake Deployment

on:
  push:
    branches:
      - development
      - uat
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set Environment Name
      - name: Set Deployment Environment
        run: |

          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "ENV=DEV" >> $GITHUB_ENV

          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "ENV=UAT" >> $GITHUB_ENV

          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV=PRD" >> $GITHUB_ENV

          fi

      # Install Snowflake Python Connector
      - name: Install Snowflake Connector

        run: |
          pip install snowflake-connector-python

      # Deploy SQL Files
      - name: Deploy Snowflake Objects

        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          ENV: ${{ env.ENV }}

        run: |

          python <<EOF

          import snowflake.connector
          import os

          print(f"Starting deployment for environment: {os.environ['ENV']}")

          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE']
          )

          cursor = conn.cursor()

          hierarchy_file = "RETAIL_ANALYTICS_RAW/object_hierarchy.txt"

          with open(hierarchy_file, "r") as f:

              for line in f:

                  line = line.strip()

                  # Skip comments
                  if line.startswith("--") or line == "":
                      continue

                  print(f"Executing file: {line}")

                  with open(line, "r") as sql_file:

                      sql = sql_file.read()

                      # Replace environment variable
                      sql = sql.replace("&{env}", os.environ['ENV'])

                      cursor.execute(sql)

                      print("SUCCESS")

          cursor.close()
          conn.close()

          print("Deployment completed successfully.")

          EOF