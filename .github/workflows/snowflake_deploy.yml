name: Snowflake Deployment

on:
  push:
    branches:
      - development
      - uat
      - main

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set Environment Name
      - name: Set Deployment Environment
        run: |

          if [[ "${GITHUB_REF_NAME}" == "development" ]]; then
            echo "ENV=DEV" >> $GITHUB_ENV

          elif [[ "${GITHUB_REF_NAME}" == "uat" ]]; then
            echo "ENV=UAT" >> $GITHUB_ENV

          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV=PRD" >> $GITHUB_ENV

          fi

      # Install Required Packages
      - name: Install Python Packages

        run: |
          pip install snowflake-connector-python cryptography

      # Deploy SQL Files
      - name: Deploy Snowflake Objects

        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          ENV: ${{ env.ENV }}

        run: |

          python <<EOF

          import snowflake.connector
          import os

          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.backends import default_backend

          print(f"Starting deployment for environment: {os.environ['ENV']}")

          # Load private key
          private_key = serialization.load_pem_private_key(
              os.environ['SNOWFLAKE_PRIVATE_KEY'].encode(),
              password=None,
              backend=default_backend()
          )

          # Convert key format for Snowflake connector
          pkb = private_key.private_bytes(
              encoding=serialization.Encoding.DER,
              format=serialization.PrivateFormat.PKCS8,
              encryption_algorithm=serialization.NoEncryption()
          )

          # Connect to Snowflake
          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              private_key=pkb,
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              role=os.environ['SNOWFLAKE_ROLE']
          )

          cursor = conn.cursor()

          hierarchy_file = "RETAIL_ANALYTICS_RAW/object_hierarchy.txt"

          with open(hierarchy_file, "r") as f:

              for line in f:

                  line = line.strip()

                  # Skip comments and blank lines
                  if line.startswith("--") or line == "":
                      continue

                  print(f"Executing file: {line}")

                  with open(line, "r") as sql_file:

                      sql = sql_file.read()

                      # Replace ENV variable
                      sql = sql.replace("&{env}", os.environ['ENV'])

                      cursor.execute(sql)

                      print("SUCCESS")

          cursor.close()
          conn.close()

          print("Deployment completed successfully.")

          EOF